<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Fasilitas Mahasiswa UNTAN</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- MarkerCluster plugin -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header">
  <h1>🗺 Peta Fasilitas Mahasiswa UNTAN</h1>
  <p>Node.js + Express + Leaflet.js · Clustering &amp; Filter</p>
</header>
<div class="app-container">
  <aside class="sidebar">
    <div class="panel">
      <h3>📊 Statistik Kategori</h3>
      <div id="stats">Memuat…</div>
    </div>
    <div class="panel">
      <h3>🔍 Filter Kategori</h3>
      <label class="toggle">
        <input type="checkbox" class="filter-kategori" value="kafe" checked>
        <span>Kafe</span>
      </label>
      <label class="toggle">
        <input type="checkbox" class="filter-kategori" value="belajar" checked>
        <span>Belajar</span>
      </label>
      <label class="toggle">
        <input type="checkbox" class="filter-kategori" value="kuliner" checked>
        <span>Kuliner</span>
      </label>
    </div>
    <div class="panel">
      <h3>🎛 Kontrol Peta</h3>
      <label class="toggle">
        <input type="checkbox" id="toggleLabels" checked>
        <span>Tampilkan label fasilitas</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="toggleCluster">
        <span>Gabungkan titik berdekatan</span>
      </label>
    </div>
    <div class="panel">
      <h3>ℹ Legenda</h3>
      <div class="legenda">
        <div><span class="dot dot-kafe"></span> Kafe</div>
        <div><span class="dot dot-belajar"></span> Belajar</div>
        <div><span class="dot dot-kuliner"></span> Kuliner</div>
      </div>
    </div>
    <div class="panel">
      <h3>✏ Digitasi Area Baru</h3>
      <p style="font-size:12px;color:#475569">
        Klik ikon polygon di toolbar kiri peta untuk menggambar area parkir baru.
      </p>
    </div>
  </aside>
  <main id="map"></main>
</div>
<script src="js/app.js"></script>
</body>
</html>
